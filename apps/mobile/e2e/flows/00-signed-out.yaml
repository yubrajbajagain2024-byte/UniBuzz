# Signed-out tour: Home (Stories | Orbit | Buzz along the top left, the three icons at the top right, the Campus | Global
# toggle under them for anyone with a university while it is shown: opens on Orbit, the full-screen feed, and the pager
# swipes between the three), the Notifications bell (signed out it asks to log in), Explore (the compass in Home's top
# bar: Housing | Roommate | Marketplace, opening on Housing, same pager), Events (bottom tab: For you | All events),
# Messages (bottom tab: asks to log in), and the sign-in prompt on the Profile tab.
# The bottom bar is icons only: Home, Events, Create, Messages, Profile. Needs the seeded sample posts (node e2e/sim-seed.mjs).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Continue|Buzz"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Create, .*"
    timeout: 60000
# Expo Go's floating developer gear sits in the top-right corner, over the Notifications bell: drag it out of the way
# (not present in real builds).
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
- assertVisible: "Stories"
- assertVisible: "Orbit"
- assertVisible: "Buzz"
# Posts and Reels are sections without a tab in the app: Orbit carries both.
- assertNotVisible: "Posts"
- assertNotVisible: "Reels"
- takeScreenshot: e2e/screenshots/01-home-orbit
# The top bar is one row: the three labels along its left, then the compass (Explore), the bell and the magnifier at its
# right; under them, for anyone with a university, the Campus | Global toggle (hidden for now: SCOPE_TOGGLE_SHOWN in
# src/lib/home-scope.ts). Create in the middle of the bottom bar opens the camera on SNAP (BUZZ | SNAP | POST | REEL).
# Signed out there is no campus to pick, so the toggle is not drawn either way.
- assertNotVisible: "Campus"
- assertNotVisible: "Global"
- takeScreenshot: e2e/screenshots/01-home-bar
# Orbit holds posts and reels only: the seeded Buzz thread is not on this page (it waits on the Buzz page).
- assertNotVisible: ".*Landlord wants to keep my whole deposit.*"
# The three pages sit side by side in a pager: a flick to the left slides from Orbit to Buzz. It starts low on the page,
# clear of the rail, because a post's photo carousel keeps the horizontal swipe for itself until its last photo.
- swipe:
    start: "60%,80%"
    end: "10%,80%"
    duration: 400
- waitForAnimationToEnd
# Buzz is for signed-in students only: signed out, its page asks you to log in (nothing of Buzz loads).
- assertVisible: "Buzz is anonymous campus talk"
- assertVisible: "Log in"
- takeScreenshot: e2e/screenshots/01-home-buzz
- tapOn: "Stories"
- waitForAnimationToEnd
# Signed out there are no stories to show, only the invitation to log in.
- assertVisible: "Stories from your campus"
- takeScreenshot: e2e/screenshots/01-home-stories
# A tap on the label brings Orbit back.
- tapOn: "Orbit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create, .*"
    timeout: 30000
# Notifications: the bell in the top-right corner of Home's floating top bar opens the notifications screen; signed out it
# asks to log in. "Notifications" is the bell's exact label (signed in it reads "Notifications, N unread").
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Log in to see your notifications"
    timeout: 30000
- takeScreenshot: e2e/screenshots/08-notifications-signed-out
# Maestro's `back` only works on Android: on iOS the left-edge swipe pops the screen.
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create, .*"
    timeout: 30000
# Explore (housing.tsx), from the compass in Home's top bar: its own top bar (Back, "Find", then Housing | Roommate |
# Marketplace, then the search box of the page on screen, named "Search apartments", "Search roommate posts" or
# "Search marketplace", then the pills). It opens on Housing (apartments); the "Roommate" label above the pager slides to
# the other half and a flick to the right brings Housing back. The floating "+" follows the visible half. It is a screen
# above the tabs, without the bottom bar: swipe back to Home before the next tab.
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "Find"
    timeout: 30000
- takeScreenshot: e2e/screenshots/04-apartments
- tapOn: "Roommate"
- extendedWaitUntil:
    visible: "Looking for a room"
    timeout: 30000
- takeScreenshot: e2e/screenshots/02-roommates
# Flick on the pills row: lower down a card's photo carousel would keep the swipe for itself.
- swipe:
    start: "15%,25%"
    end: "85%,25%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Find"
- tapOn: "Marketplace"
# The Marketplace is the third page of Explore: the label above the pager slides to it, its category pills in the pills row.
- extendedWaitUntil:
    visible: "Mattress & bedding"
    timeout: 30000
- takeScreenshot: e2e/screenshots/03-marketplace
# Back to Home, then Events, the bottom bar's second tab: "Events", For you | All events, the search box and the date and
# category pills over the campus's calendar (migration 61); signed out it still lists the campus's events.
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create, .*"
    timeout: 30000
- tapOn: "Events.*"
- extendedWaitUntil:
    visible: "Search events"
    timeout: 30000
- takeScreenshot: e2e/screenshots/07-events
# Messages: the bottom tab after Create; signed out it asks to log in.
- tapOn: "Messages.*"
- assertVisible: "Log in to see your messages"
# Profile is the last bottom tab; signed out it shows the sign-in prompt.
- tapOn: "Profile.*"
- assertVisible: "Join UniBuzz"
- takeScreenshot: e2e/screenshots/05-profile-signed-out
- tapOn: "Create account"
- assertVisible: "Create your account"
- takeScreenshot: e2e/screenshots/06-signup
