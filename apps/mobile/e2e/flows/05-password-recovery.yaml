# Password recovery in the app, signed out, against a project whose dev server the simulator is pointed at (the staging
# one: never production, since a reset link is used and a password set). Forgot password from the login screen, then a
# recovery link that opens the app (the tokens Supabase puts after the # as on the website: packages/shared/src/auth.ts),
# the new password typed twice and saved, then the same link again, expired.
#   RESET_LINK: the app's address with the link's fragment, e.g. exp://127.0.0.1:8082/--/reset-password#access_token=…
#   (supabase/tests/staging/auth-recovery.mjs shows how a link's landing is read); EMAIL: the account's; NEW_PASSWORD.
# Run: e2e/run.sh e2e/flows/05-password-recovery.yaml -e EMAIL=… -e RESET_LINK=… -e NEW_PASSWORD=…
appId: host.exp.Exponent
---
- openLink: "exp://127.0.0.1:8082/--/login"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 120000
- tapOn: "Forgot password?"
- assertVisible: "Reset your password"
- tapOn: "you@txstate.edu"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Send reset link"
# Sent, or staging's mailer limit (two emails an hour), said in the app's own words.
- extendedWaitUntil:
    visible: "Check your email|Too many tries"
    timeout: 30000
- takeScreenshot: e2e/screenshots/05-forgot-sent
- openLink: ${RESET_LINK}
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 30000
- takeScreenshot: e2e/screenshots/05-reset-form
- tapOn: "8 to 72 characters"
- inputText: ${NEW_PASSWORD}
- tapOn: "The same password"
- inputText: "not-the-same-1"
- hideKeyboard
- tapOn: "Save new password"
- assertVisible: "The passwords don't match"
- tapOn: "not-the-same-1"
- eraseText: 20
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn: "Save new password"
- extendedWaitUntil:
    visible: "Your password is changed."
    timeout: 30000
- takeScreenshot: e2e/screenshots/05-reset-done
- tapOn: "OK"
# Signed in now: Home shows the story tray's "Your story".
- extendedWaitUntil:
    visible: "Your story"
    timeout: 30000
- openLink: ${RESET_LINK}
- extendedWaitUntil:
    visible: "This link has expired"
    timeout: 30000
- assertVisible: "Request a new link"
- takeScreenshot: e2e/screenshots/05-reset-expired
