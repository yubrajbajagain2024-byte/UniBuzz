# Orbit's full-screen feed and the create menu, signed in (run 01-signed-in.yaml first so a session is stored).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Create, .*"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# SAFETY: these flows tap, vote and post. They must only ever run as a seeded test account (ui-sim-…),
# never as a real person who happens to be signed in on this simulator. Fails here otherwise.
# Signed in, the Profile tab is your profile ("Edit profile" under the numbers): your name at the top ("…, account options")
# opens the account sheet, titled with the signed-in email.
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join UniBuzz|Edit profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Edit profile"
    commands:
      - tapOn: ".*ccount options"
      - assertVisible: "ui-sim-.*@txstate.edu"
      - tapOn: "Cancel"
- assertVisible: "Edit profile"
- tapOn: "Home.*"
# Orbit, the landing page: the campus's posts and reels full screen, one to a page. A reel plays with its sound on and
# there is no sound button at all (VIDEO_MUTED in src/lib/video-sound.ts); the rail reads like, comments, save, share.
- extendedWaitUntil:
    visible: "Orbit"
    timeout: 15000
- tapOn: "Orbit"
- waitForAnimationToEnd
- assertVisible: "Like|Unlike"
- assertVisible: "Save|Unsave"
- assertNotVisible: "Turn sound on|Turn sound off"
- takeScreenshot: e2e/screenshots/13-orbit
# Swiping up moves to the next post, TikTok's way.
- swipe:
    start: "50%,75%"
    end: "50%,25%"
    duration: 300
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/13-orbit-next
# Create, in the middle of the bottom bar, opens the live camera straight away on SNAP (BUZZ | SNAP | POST | REEL,
# Upload for the library).
- tapOn: "Create, .*"
- extendedWaitUntil:
    visible: "SNAP"
    timeout: 15000
- assertVisible: "REEL"
- assertVisible: "BUZZ"
- assertVisible: "POST"
- assertVisible: "Upload"
- takeScreenshot: e2e/screenshots/14-create-camera
- tapOn: "Close the camera"
- waitForAnimationToEnd
# Buzz's composer is a sheet on Home's Buzz page, opened from that page's own button (after the guidelines gate, if needed).
- tapOn: "Buzz"
- waitForAnimationToEnd
- tapOn: "New buzz"
- extendedWaitUntil:
    visible: "I understand|You're anonymous.*"
    timeout: 30000
- runFlow:
    when:
      visible: "I understand"
    commands:
      - tapOn: "I understand"
- extendedWaitUntil:
    visible: "You're anonymous.*"
    timeout: 30000
- assertVisible: "Buzz it"
# A category: one row of chips under Campus | Global; picking one says what belongs there.
- tapOn: "Confessions"
- assertVisible: "Confessions: Things you'd never say out loud"
- takeScreenshot: e2e/screenshots/15-create-buzz
- tapOn: "Close"
